<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#container {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    justify-content: center;
}

/* default: 1 column */
#container img {
    width: 100%;
    max-width: 300px;
    height: 200px;
}

/* 2 columns */
@media screen and (min-width: 480px) {
    #container img {
        width: calc(50% - 2px)
    }
}

/* 4 columns */
@media screen and (min-width: 760px) {
    #container img {
        width: calc(25% - 2px)
    }
}
</style>
</head>

<body>
<p>Media queries example</p>

<div id="container">
    <img src="https://thumbs.dreamstime.com/b/fruits-10193811.jpg" width="300" height="200">
    <img src="https://www.shutterstock.com/image-photo/scenic-image-iceland-incredible-nature-600nw-1453557041.jpg" width="300" height="200">

    <img src="https://s.abcnews.com/images/International/twip-01-kenyan-woman-gty-jt-170817_3x2_1600.jpg?w=1600" width="300" height="200">
